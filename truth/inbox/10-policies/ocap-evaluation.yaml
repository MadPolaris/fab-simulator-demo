kind: note
type: policy
name: OcapEvaluation
name_zh: OCAP 求值
description: When a step fails, evaluate OCAP rules against the current run state in priority order (lower
  number first). The first matching rule whose trigger condition holds and which has not exceeded maxTriggersPerLot
  fires its action plan; the queue moves on.
description_zh: 步骤失败时按优先级对当前运行状态求值 OCAP 规则（数字小的先）。首条触发条件成立且未超本 Lot 触发上限的规则执行处置预案，队列继续。
triggers:
- step-failed
invokes:
- handle-ocap
