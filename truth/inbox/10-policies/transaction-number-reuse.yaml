kind: note
type: policy
name: TransactionNumberReuse
name_zh: 事务编号沿用
description: Transactions spanning multiple lots are numbered workOrderId + step name + execution index.
  When a run recovers, the same inputs reproduce the same number instead of opening a duplicate transaction.
description_zh: 跨 Lot 事务编号=工单号+步骤名+执行序号。运行恢复时同样输入算出同样编号，不另开重复事务。
triggers:
- run-recovered
invokes:
- split-sublot
