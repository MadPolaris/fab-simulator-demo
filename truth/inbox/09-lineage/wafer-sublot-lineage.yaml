name_zh: 晶圆子 Lot 血缘
description: Wafers move parent → child on split (reserve-then-confirm), child → parent on merge. The
  child-lot view (suffix → status, wafer count) is created at split and transitioned at merge, so lineage
  is queryable both ways.
description_zh: 晶圆在切分时从母 Lot 到子 Lot（先预留后确认），合并时回归。子 Lot 视图（后缀→状态、片数）在切分时建立、合并时迁移，双向可查血缘。
links:
