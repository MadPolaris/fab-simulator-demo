# ═══ truth note — reconstructed from truth/ tree (no live workshop was held) ═══
kind: note
type: command
name: StartPipelineRun
name_zh: 启动流水线运行
description: Start executing the fab step queue for a work order. One work order, one run — a second start
  is refused.
description_zh: 为一个工单启动 fab 步骤队列。一个工单一次运行，重复启动被拒绝。
triggers:
- 'role: 工艺工程师'
produces:
- run-started
- step-completed
- step-failed
- run-completed
parameters:
- 'workOrderId: string'
- 'scenarioId: string'
guards:
- 工单未在跑也未完工
