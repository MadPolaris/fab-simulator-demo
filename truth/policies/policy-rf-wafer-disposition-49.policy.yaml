    "info": {
      "triggers": [
        {
          "event": "wafer-classified",
          "aggregate": "Wafer Lot"
        }
      ],
      "invokes": [
        {
          "command": "split-sublot",
          "aggregate": "Wafer Lot"
        },
        {
          "command": "scrap-wafers",
          "aggregate": "Wafer Lot"
        },
        {
          "command": "hold-wafers",
          "aggregate": "Wafer Lot"
        }
      ]
    },
    "rules": [
      {
        "when": "classification is PASS",
        "then": "wafer continues the flow (no slice invoked)"
      },
      {
        "when": "classification is BORDERLINE",
        "then": "hold-wafers — park until human review"
      },
      {
        "when": "classification is FAIL and reworkCount < maxReworkCount",
        "then": "split-sublot with reason rework"
      },
      {
        "when": "classification is FAIL and reworkCount >= maxReworkCount",
        "then": "scrap-wafers — budget exhausted"
      },
      {
        "when": "classification is SCRAP",
        "then": "scrap-wafers"
      }
    ],
