# ═══ truth atom — hand-editable; types: truth/types.yaml ═══
kind: policy
id: lot-notification-guarantee
name: Lot Notification Guarantee
name_zh: Lot 通知确认保障
description: >
  When the pipeline tells a lot "record this measurement / classification /
  split", the lot must confirm it received and journaled the fact before the
  step counts as done. A lot that crashed or is too slow fails the step
  (LOT_ACK_TIMEOUT) instead of leaving the two sides silently diverged —
  and the failure flows through the normal step-failure path (OCAP evaluation).
  2026-10-18 ARBITRATED: fire-and-forget lot notifications are retired; every
  notification is acknowledged per step.
description_zh: >
  流水线通知 Lot"记下这次量测 / 分类 / 分批"时，Lot 必须确认收到并记账，
  该步骤才算完成。崩溃或过慢的 Lot 会让步骤失败（LOT_ACK_TIMEOUT），
  而不是让两边悄悄脱节——失败走正常的步骤失败路径（OCAP 求值）。
  2026-10-18 已仲裁：fire-and-forget 的 Lot 通知退役，每条通知按步骤确认。
triggers:
  - event: run-started
    note: the guarantee is established when the run starts and governs every step
invokes:
  - slice: start-pipeline-run
rules:
  - when: a step sends any lot notification
    then: the notification is tracked in the step's acknowledgment gate
    note: gate installed fresh per step by the step interpreter
  - when: all tracked notifications are confirmed before the step body finishes
    then: the step completes normally
  - when: any notification is unconfirmed after the ack timeout
    then: the step fails with LOT_ACK_TIMEOUT (flows to OCAP evaluation like any step failure)
    note: 5s timeout; local lot actors confirm in milliseconds
  - when: steps run outside the actor pipeline (direct invocation)
    then: the old fire-and-forget behavior applies (no gate to drain)
    note: demo/test path only, not the production run path
