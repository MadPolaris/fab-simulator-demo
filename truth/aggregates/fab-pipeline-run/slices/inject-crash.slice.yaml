# ═══ truth atom — hand-editable; types: truth/types.yaml ═══
kind: slice
id: inject-crash
name: Inject Crash (M3.5)
name_zh: 注入宕机（M3.5）
description: >
  M3.5 demo control: interrupt the run WITHOUT erasing its progress
  records, then let recovery continue from the breakpoint. Proves
  crash-resilience live: finished steps are skipped, the run picks up
  where it stopped. Injecting a fault into a single piece of equipment
  is the finer-grained variant — force its next job to fail with a chosen
  fault type.
description_zh: >
  M3.5 演示控制：打断运行但不清除进度记录，然后让恢复逻辑从断点继续。
  现场证明抗宕机能力：已完成的步骤跳过，从停下的地方接着跑。
  往单台设备注入故障是更细的变体——强制它的下一个 job
  按指定故障类型失败。
aggregate: fab-pipeline-run
parameters:
  - { name: workOrderId, type: string, description: Run to interrupt }
guards:
  - description: run is currently active
produces:
  - crash-injected
  - run-recovered
events:
  crash-injected:
    description: The run was interrupted; progress records kept.
    payload:
      - { name: workOrderId, type: string, description: Interrupted run }
  run-recovered:
    description: Recovery finished; the run continued from its breakpoint.
    payload:
      - { name: workOrderId, type: string, description: Recovered run }
      - { name: resumedFromStep, type: string, description: Step the run resumed from }
