# ═══ truthsrc atom — hand-editable; contract: SCHEMA.md ═══

kind: slice
aggregate: "Fab Pipeline Run"
command: start-pipeline-run
payload:
  {
    "id": "start-pipeline-run",
    "name": "start-pipeline-run",
    "title": "Start Pipeline Run",
    "name_zh": "启动流水线运行",
    "description": "Start executing the fab step queue for a work order: record the run's start with its initial state, then work through the steps in order. A second start for an already running or finished work order is refused.",
    "description_zh": "为一个工单启动 fab 步骤队列：记下运行开始（含初始状态），然后按顺序 执行各步骤。对已在跑或已完工的工单再次启动会被拒绝。",
    "parameters": [
      {
        "name": "scenarioId",
        "dataType": "string",
        "description": "Demo scenario driving the run"
      },
      {
        "name": "workOrderId",
        "dataType": "string",
        "description": "Work order under execution"
      },
      {
        "name": "steps",
        "dataType": "step[]",
        "description": "Ordered step queue for this run"
      },
      {
        "name": "initialState",
        "dataType": "fab-run-state",
        "description": "Initial run state"
      }
    ],
    "guards": [
      {
        "description": "no running or finished run exists for this workOrderId"
      }
    ],
    "produces": [
      "run-started",
      "step-completed",
      "step-failed",
      "run-completed",
      "run-failed"
    ]
  }
events:
  {
    "run-started": {
      "name": "run-started",
      "description": "The run began; its initial state was recorded.",
      "payloads": [
        {
          "name": "workOrderId",
          "dataType": "string",
          "description": "Work order under execution"
        },
        {
          "name": "scenarioId",
          "dataType": "string",
          "description": "Driving scenario"
        }
      ],
      "bindings": [],
      "foldAssignments": []
    },
    "step-completed": {
      "name": "step-completed",
      "description": "A step finished cleanly; the breakpoint moved forward.",
      "payloads": [
        {
          "name": "stepName",
          "dataType": "string",
          "description": "Business step name"
        },
        {
          "name": "completedStepCount",
          "dataType": "integer",
          "description": "Steps finished so far"
        },
        {
          "name": "metadata",
          "dataType": "map<string",
          "description": "Step-emitted metadata"
        }
      ],
      "bindings": [],
      "foldAssignments": []
    },
    "step-failed": {
      "name": "step-failed",
      "description": "A step failed before OCAP got its chance (recorded for ordering; OCAP may still save it).",
      "payloads": [
        {
          "name": "stepName",
          "dataType": "string",
          "description": "Failing step"
        },
        {
          "name": "error",
          "dataType": "step-error",
          "description": "Structured step error"
        }
      ],
      "bindings": [],
      "foldAssignments": []
    },
    "run-completed": {
      "name": "run-completed",
      "description": "All steps done; the run reached its terminal state.",
      "payloads": [
        {
          "name": "workOrderId",
          "dataType": "string",
          "description": "Work order"
        },
        {
          "name": "passCount",
          "dataType": "integer",
          "description": "Wafers passed"
        },
        {
          "name": "scrapCount",
          "dataType": "integer",
          "description": "Wafers scrapped"
        }
      ],
      "bindings": [],
      "foldAssignments": []
    },
    "run-failed": {
      "name": "run-failed",
      "description": "A step failed and no OCAP plan saved it.",
      "payloads": [
        {
          "name": "workOrderId",
          "dataType": "string",
          "description": "Work order"
        },
        {
          "name": "stepName",
          "dataType": "string",
          "description": "Failing step"
        },
        {
          "name": "error",
          "dataType": "step-error",
          "description": "Structured step error"
        }
      ],
      "bindings": [],
      "foldAssignments": []
    }
  }
