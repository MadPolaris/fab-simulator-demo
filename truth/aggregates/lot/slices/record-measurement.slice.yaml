# ═══ truthsrc atom — hand-editable; contract: SCHEMA.md ═══

kind: slice
aggregate: "Wafer Lot"
command: record-measurement
payload:
  {
    "id": "record-measurement",
    "name": "record-measurement",
    "title": "Record Measurement",
    "name_zh": "记录量测",
    "description": "Record a wafer's CD measurement from the metrology equipment. The measurement itself carries no judgment — classification is a separate step.",
    "description_zh": "记录量测设备报出的一片晶圆的 CD 值。量测值本身不带判断——分类是另一步。",
    "parameters": [
      {
        "name": "waferId",
        "dataType": "string",
        "description": "Measured wafer"
      },
      {
        "name": "cdNm",
        "dataType": "number",
        "description": "Measured critical dimension (nm)"
      }
    ],
    "guards": [
      {
        "description": "wafer is a member of the lot"
      }
    ],
    "produces": [
      "wafer-measured"
    ]
  }
events:
  {
    "wafer-measured": {
      "name": "wafer-measured",
      "description": "A CD measurement was recorded, awaiting classification.",
      "payloads": [
        {
          "name": "waferId",
          "dataType": "string",
          "description": "Wafer"
        },
        {
          "name": "cdNm",
          "dataType": "number",
          "description": "Measured CD (nm)"
        }
      ],
      "bindings": [],
      "foldAssignments": []
    }
  }
