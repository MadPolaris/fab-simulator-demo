# ═══ truthsrc atom — hand-editable; contract: SCHEMA.md ═══

kind: aggregate
name: "Wafer Lot"
order:
  commands: ["classify-wafer","hold-wafers","merge-sublot","record-measurement","scrap-wafers","split-sublot"]
  events: ["wafer-classified","wafers-held","wafers-released","sublot-merged","wafer-measured","wafers-scrapped","sublot-split"]
payload:
  {
    "id": "lot",
    "name": "Wafer Lot",
    "name_zh": "晶圆 Lot",
    "description": "A batch of wafers traveling together in a FOUP through the fab. Tracks wafer membership, per-wafer classification, the route card (ordered area steps), completed steps, and child lots created by splits (rework / pilot / scrap). Wafer transfers between lots go in two moves — reserve, then confirm — so an interruption never loses or duplicates a wafer: it resolves to either fully-transferred or not-transferred, never half.",
    "description_zh": "装在 FOUP 里一起走 fab 的一批晶圆。跟踪晶圆成员、每片晶圆的分类、 route card（有序的设备区步骤）、已完成步骤，以及切分产生的子 Lot （返工 / 先导 / 报废）。Lot 之间的晶圆转移分两步——先预留、再确认， 中断时要么全转要么没转，不丢片也不重片。 2026-10-18 已仲裁：Lot 是恢复时的权威——Lot 在工艺路线上的位置就是状态 （如真实晶圆厂的 MES）。流水线恢复时应以 Lot 上报的状态为准来对账； 目前实现上靠\"通知确认 + 幂等重放\"收敛，显式对账是已知缺口（见 EXTRACTION-NOTES #7）。",
    "entity": "WaferLot",
    "identifier": {
      "name": "lotId",
      "dataType": "string",
      "origin": "Entity id == lotId. Child lots get their own ids; the parent records the split (RecordSubLotCreated) so lineage is queryable."
    },
    "stateFields": [
      {
        "name": "lotId",
        "dataType": "string",
        "description": "Lot identity."
      },
      {
        "name": "productId",
        "dataType": "string",
        "description": "Product being manufactured."
      },
      {
        "name": "wafers",
        "dataType": "map<string, wafer-state>",
        "description": "WaferId → state (status, classification, rework count, measurements)."
      },
      {
        "name": "status",
        "dataType": "string",
        "description": "Lifecycle status (created, in-process, held, sealed, …)."
      },
      {
        "name": "currentArea",
        "dataType": "string",
        "description": "Equipment area the lot is currently in (or at)."
      },
      {
        "name": "routeCard",
        "dataType": "string[]",
        "description": "Ordered area-id steps assigned to this lot."
      },
      {
        "name": "completedSteps",
        "dataType": "string[]",
        "description": "Route-card steps already executed."
      },
      {
        "name": "childLots",
        "dataType": "map<string, string>",
        "description": "Child lot id → split reason (rework / pilot / scrap)."
      },
      {
        "name": "parentLotId",
        "dataType": "string",
        "description": "Set on child lots; empty on root lots."
      }
    ],
    "statusEnum": [
      "created",
      "in-process",
      "held",
      "sealed"
    ],
    "statusTransitions": {},
    "stateGates": {
      "hold-wafers": {
        "fromStates": [
          "in-process"
        ],
        "toState": "held"
      },
      "split-sublot": {
        "fromStates": [
          "in-process"
        ],
        "toState": "in-process"
      },
      "merge-sublot": {
        "fromStates": [
          "in-process"
        ],
        "toState": "in-process"
      }
    },
    "aggregateRuleRefs": [
      {
        "ruleId": "no-lost-wafers",
        "desc": "Wafer transfers go reserve-then-confirm; an interruption between the two resolves to either fully-transferred or not-transferred, never half.",
        "desc_zh": "晶圆转移先预留后确认；两步之间被打断时，要么全转要么没转，绝不转一半。"
      },
      {
        "ruleId": "reentry-tracked",
        "desc": "A lot may visit the same area multiple times; reentryIndex counts the visit (0, 1, 2, …) so step identity stays unambiguous.",
        "desc_zh": "Lot 可多次重入同一设备区；reentryIndex 记录第几次，保证步骤身份不混淆。"
      },
      {
        "ruleId": "change-recording",
        "desc": "Every change to a lot (creation, transfers, measurements, classifications, splits, merges, scraps) is recorded as it happens.",
        "desc_zh": "Lot 的每次变更（创建、转移、量测、分类、切分、合并、报废）发生时即被记录。"
      },
      {
        "ruleId": "lifecycle-unmodeled-commands",
        "desc": "The full lifecycle also uses create-lot (created -> in-process), release-wafers (held -> in-process) and seal-lot (in-process -> sealed); these commands are not modeled as slices in this tree."
      }
    ]
  }
