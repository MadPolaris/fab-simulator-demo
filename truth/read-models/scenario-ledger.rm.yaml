# ═══ truth atom — hand-editable; types: truth/types.yaml ═══
kind: read-model
id: scenario-ledger
name: Scenario Ledger
name_zh: 场景台账
description: >
  Per-scenario accounting: which work orders ran under this scenario and
  how each ended. The demo's "what happened" summary.
description_zh: >
  按场景的台账：这个场景下跑了哪些工单、每个什么结局。演示的"发生了什么"汇总。
served_by: fab demo page scenario panel
sources:
  - fab-pipeline-run
  - work-order
fields:
  - name: entries
    type: map<string, string>
    description: WorkOrderId → completed | failed.
    derived_from: run-completed / run-failed events
  - name: totals
    type: map<string, integer>
    description: Aggregate pass / scrap counts across the scenario's runs.
    derived_from: sum over run states
