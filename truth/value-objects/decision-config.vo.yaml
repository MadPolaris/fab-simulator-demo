        "description": "Lower spec limit (nm)"
      },
      {
        "name": "upperSpecNm",
        "dataType": "number",
        "description": "Upper spec limit (nm)"
      },
      {
        "name": "borderlineWindowNm",
        "dataType": "number",
        "description": "Margin above upperSpec that is still BORDERLINE"
      },
      {
        "name": "maxReworkCount",
        "dataType": "integer",
        "description": "Rework attempts allowed before forced scrap (default 2)"
      }
    ]
