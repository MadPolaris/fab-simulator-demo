kind: value-object
name: "Cross-Lot Transaction Number"
payload:
  {
    "id": "transaction-number",
    "name": "Cross-Lot Transaction Number",
    "name_zh": "跨 Lot 事务编号",
    "description": "The number of a transaction that spans multiple lots (split/merge). The numbering rule is fixed — work order number + step name + execution index — so after an interruption the same transaction is picked up under its original number instead of opening a duplicate. Atomicity: either all lots in the transaction move, or none do.",
    "description_zh": "跨多个 Lot 的事务（切分/合并）的编号。编号规则固定——工单号+步骤名+ 执行序号，所以中断后沿用原编号继续，不另开重复事务。原子性： 事务里的 Lot 要么全动，要么全不动。",
    "fields": [
      {
        "name": "workOrderId",
        "dataType": "string",
        "description": "Work order the transaction belongs to"
      },
      {
        "name": "stepName",
        "dataType": "string",
        "description": "Step that opened the transaction"
      },
      {
        "name": "executionIndex",
        "dataType": "integer",
        "description": "How many times this step has executed"
      }
    ]
  }
