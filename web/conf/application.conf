# fab-simulator-web — Play 配置
# Demo 级别：MongoDB 配置按需修改。

play.http.secret.key = "changeme-for-demo-only"

play.modules.disabled += "play.api.db.DBModule"
play.modules.disabled += "play.api.db.evolutions.EvolutionsModule"

akka {
  loglevel = INFO

  actor {
    provider = cluster
  }

  remote.artery {
    canonical.hostname = "127.0.0.1"
    canonical.port = 2551
  }

  cluster {
    seed-nodes = ["akka://application@127.0.0.1:2551"]
    downing-provider-class = "akka.cluster.sbr.SplitBrainResolverProvider"
  }

  persistence {
    journal.plugin = "akka.persistence.journal.leveldb"
    journal.leveldb.dir = "target/journal"
    snapshot-store.plugin = "akka.persistence.snapshot-store.local"
    snapshot-store.local.dir = "target/snapshots"
  }

  # MongoDB（fab 演示的 journal/query 用；无 Mongo 时相关功能不可用）
  contrib.persistence.mongodb.mongo.mongouri = "mongodb://127.0.0.1:27017/fab-simulator?maxPoolSize=20"
}

play.server.websocket.periodic-keep-alive-max-idle = 10 seconds
